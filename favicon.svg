<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sites">
  <style>
    /* Follows the viewer's theme, matching the accent tokens of the shared stylesheet. */
    .mark { fill: #123f50; }
    .lead { fill: #123f50; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #cedfe6; }
      .lead { fill: #cedfe6; }
    }
  </style>
  <!-- Four pages on one host: one leading, three following. -->
  <rect class="lead" x="6" y="6" width="24" height="24" rx="7"/>
  <rect class="mark" x="34" y="6" width="24" height="24" rx="7" opacity="0.55"/>
  <rect class="mark" x="6" y="34" width="24" height="24" rx="7" opacity="0.55"/>
  <rect class="mark" x="34" y="34" width="24" height="24" rx="7" opacity="0.3"/>
</svg>
